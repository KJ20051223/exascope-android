name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify and build
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - name: Upload installable development APK
        uses: actions/upload-artifact@v4
        with:
          name: ExaScope-development-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned release for private signing
        uses: actions/upload-artifact@v4
        with:
          name: ExaScope-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            bash ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --no-daemon
            adb pull /sdcard/Android/data/io.github.exascope/files/screenshots app-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app-screenshots/

